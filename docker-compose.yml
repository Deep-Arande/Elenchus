# Local development stack: api, worker, redis, web.
#
# Supabase (Postgres + pgvector + auth) is NOT in this compose file — run it
# separately with the Supabase CLI (`supabase start`). See README.md. Services
# below reach the host-run Supabase via `host.docker.internal`.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      # Override localhost-based URLs for the compose network.
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: ./apps/api
    command: ["arq", "elenchus.jobs.worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./apps/web
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - api
